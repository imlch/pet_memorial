# ============================================================
# 宠物寄存格子管理系统 - Nginx 配置示例
# 路径：/etc/nginx/sites-available/pet-memorial.conf
# 启用：ln -s /etc/nginx/sites-available/pet-memorial.conf /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 80;
    server_name pet.yourdomain.com;   # ← 改成你的域名

    # 文档根目录：对应项目的 public/ 文件夹
    root /var/www/pet-memorial/public;
    index index.html;

    # 静态资源缓存（HTML 不缓存，避免更新后用户看到旧版本）
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 其他静态资源缓存 7 天
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback（当前是单文件，实际不会用到，保留以备后续升级）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml;

    # 日志
    access_log /var/log/nginx/pet-memorial.access.log;
    error_log  /var/log/nginx/pet-memorial.error.log;
}

# ============================================================
# HTTPS（强烈建议！）
# 使用 Let's Encrypt 免费证书一键配置：
#   apt install certbot python3-certbot-nginx -y
#   certbot --nginx -d pet.yourdomain.com
# Certbot 会自动把上面的 80 配置升级为 443 + 自动续期
# ============================================================
